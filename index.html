<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RBMK Design - Nuclear Reactor Simulator</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">RBMK</span>
          <input id="design-name-input" type="text" placeholder="Untitled RBMK" value="Untitled RBMK" />
        </div>
        
        <label class="compact-field">
          Grid
          <select id="grid-size-select"></select>
        </label>
        
        <button id="btn-paint-tool" class="active" title="Paint selected channel">Paint</button>
        <button id="btn-erase-tool" class="danger" title="Erase cells">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>
        <button id="btn-run-sim" class="run" title="Run simulation">
          <span class="icon-span">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          </span>
          <span class="text-span">Run</span>
        </button>
        <button id="btn-reset-sim">Reset</button>
        <button id="btn-save-slot" title="Save locally">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
          Save
        </button>
        <button id="btn-export-json" title="Export design JSON">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        </button>
        <button id="btn-import-json" title="Import design JSON">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        </button>
        <input id="file-import-input" type="file" accept="application/json,.json" style="display: none;" />
      </header>

      <main class="workspace">
        <aside class="panel palette">
          <h2>Channels</h2>
          <div id="palette-list" class="palette-list"></div>

          <section id="fuel-select-section" style="display: none;">
            <h3>Fuel</h3>
            <select id="fuel-rod-select" class="wide"></select>
          </section>

          <section id="steam-select-section" style="display: none;">
            <h3>Steam</h3>
            <select id="steam-type-select" class="wide"></select>
          </section>

          <section>
            <h3>Counts</h3>
            <div id="counts-list" class="stat-list"></div>
          </section>
        </aside>

        <section class="reactor-area">
          <div class="grid-wrap">
            <div id="reactor-grid" class="reactor-grid"></div>
          </div>
        </section>

        <aside class="panel inspector">
          <h2>DODD</h2>
          <div class="panel-subtitle">Dump of Ordered Diagnostic Data</div>
          <div id="dodd-content">
            <div class="empty-state">Select a column to inspect live values.</div>
          </div>

          <section>
            <h3>Saves</h3>
            <div id="saves-list" class="save-list"></div>
          </section>
        </aside>
      </main>

      <footer class="statusbar" id="statusbar">
        <div><span>Tick</span><strong id="status-tick">0</strong></div>
        <div><span>Total Flux</span><strong id="status-flux">0.0</strong></div>
        <div><span>Est. Heat</span><strong id="status-heat">0.0 HE/t</strong></div>
        <div><span>Max Heat</span><strong id="status-max-heat">20°C</strong></div>
        <div id="status-steam-container" style="display: contents;"></div>
      </footer>

      <div id="warnings-container" class="warnings"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
